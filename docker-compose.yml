# PokéVault — all-in-one self-host stack (docs/03-architecture.md §5, docs/06-securite.md §5).
#
#   cp .env.example .env   # fill in the CHANGE_ME_* placeholders
#   docker compose up -d --build
#
# Only Caddy exposes ports (80/443). Postgres, PostgREST, GoTrue and Storage stay
# on the internal `pokevault` network and are reachable only through Caddy.
# Zero secret is hardcoded here: everything comes from .env (see .env.example).
name: pokevault

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      # ":80" for local HTTP-only, or a hostname for automatic HTTPS.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - pokevault

  postgres:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Used by the image to mint the anon / service_role JWT roles.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations land in supabase/migrations/ (issue #3). Once the folder
      # exists, uncomment the line below and apply them on first boot with:
      #   docker compose exec postgres psql -U postgres -d postgres \
      #     -f /opt/pokevault/migrations/NNN_name.sql   (or `supabase db push`)
      # - ./supabase/migrations:/opt/pokevault/migrations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pokevault

  # PostgREST — required by storage-api, which queries the DB through it.
  rest:
    image: postgrest/postgrest:v13.0.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PGRST_SERVER_PORT: "3000"
    networks:
      - pokevault

  # GoTrue — Supabase Auth, OAuth Google + Discord (docs/04-integrations.md).
  auth:
    image: supabase/gotrue:v2.188.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:80}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:80}/auth/v1
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:80}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-${SITE_URL:-http://localhost:80}}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DEFAULT_GROUP_NAME: authenticated
      # OAuth Google
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      # OAuth Discord
      GOTRUE_EXTERNAL_DISCORD_ENABLED: ${GOTRUE_EXTERNAL_DISCORD_ENABLED:-false}
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${GOTRUE_EXTERNAL_DISCORD_CLIENT_ID:-}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${GOTRUE_EXTERNAL_DISCORD_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - pokevault

  # Supabase Storage — local file backend on a persistent volume.
  # Bucket `binder-covers` holds binder covers, 2 MiB max per image,
  # jpeg/png/webp only (docs/06-securite.md §3, enforced by migrations + policies).
  storage:
    image: supabase/storage-api:v1.29.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      PORT: "5000"
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY in .env}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      STORAGE_SITE_URL: ${SITE_URL:-http://localhost:80}
      # 2 MiB per upload (docs/06-securite.md §3).
      FILE_SIZE_LIMIT: "2097152"
    volumes:
      - storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - pokevault

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # Public Supabase endpoints go through Caddy (same origin, cookies).
      # Never give the web app the service_role key (docs/06-securite.md §2).
      SUPABASE_URL: ${SITE_URL:-http://localhost:80}
      SUPABASE_ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pokevault

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      SUPABASE_URL: ${SITE_URL:-http://localhost:80}
      # service_role is strictly confined to the worker (docs/06-securite.md §2).
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # Graceful shutdown: the worker handles SIGTERM/SIGINT and exits 0.
    stop_grace_period: 15s
    networks:
      - pokevault

networks:
  pokevault:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
